name: a2site
base: core22 # Base image (Ubuntu 22.04 LTS; core20 or core24 available)
version: '1.0.0'
title: Create or delete an Apache2 site
summary: Interactive scripts for creating and deleting virtual hosts in Apache 2.
description: |
  These scripts allow you to create and edit Apache 2 configuration files, add entries to the `/etc/hosts` file, and set up site directories — all via a single CLI command.

contact: https://github.com/jivtroy/a2site/issues
license: MIT

issues: https://github.com/jivtroy/a2site/issues
source-code: https://github.com/jivtroy/a2site
website: https://github.com/jivtroy/a2site

grade: stable # 'devel' for development, 'stable' for release
confinement: classic # classic is a must for such utilities

apps:
  a2mksite:
    command: bin/a2mksite
    plugs:
      - home
      - network
      - network-bind

  a2rmsite:
    command: bin/a2rmsite
    plugs:
      - home
      - network
      - network-bind

parts:
  a2site-scripts:
    plugin: dump
    source: .